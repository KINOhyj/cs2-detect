# ============================================================================
# Ultralytics 数据集配置 —— 模板文件（可提交到仓库）
# ----------------------------------------------------------------------------
# 本文件只保留字段结构与说明，不含任何真实路径。
# 本地使用请复制一份为 data_local.yaml 再填真实值：
#     cp test/data.yaml test/data_local.yaml
# 训练 / 验证时指定：
#     yolo detect train data=test/data_local.yaml model=...
# （data_local.yaml 已被 .gitignore 忽略，不会提交）
# ============================================================================

# 【path】数据集根目录。
#   - train / val 里写的相对路径，都以这个目录为基准。
#   - 可填绝对路径，也可填相对于「运行命令时所在目录」的路径。
path:                                    # 例：D:/MyProjects/yolo-cs2-detect/test

# 【train】训练集图片所在目录（相对 path）。
#   - 也可以指向一个 .txt 文件，每行写一张图片的路径。
train:                                   # 例：images

# 【val】验证集图片所在目录（相对 path）。规则同 train。
val:                                     # 例：images

# 【test】测试集图片所在目录（相对 path，可选）。
#   - 不填则默认沿用 val。
test:                                    # 例：images

# 【nc】类别数量，填整数。
#   - 必须等于 names 里类别名的个数。
nc:                                      # 例：3

# 【names】类别名称表：索引 -> 名称。
#   - 索引必须从 0 开始连续。
#   - 顺序必须与标签文件里的 class id 严格对应，写错会导致类别全乱。
names:                                   # 例：0: t   1: ct   2: c4
