[project]
name = "yolo-cs2-detect"
version = "0.1.0"
description = "基于视觉模型的cs2目标检测项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dxcam[cv2]>=0.3.0",
    "overlay",
    "pybind11[global]>=3.1.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "ultralytics>=8.4.173",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
]


[tool.uv.workspace]
members = [
    "overlay",
]


[tool.uv.sources]
overlay = { workspace = true, editable = true }
torch = [
    { index = "pytorch-cuda130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "pytorch-cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
